{% extends "base.html" %}

{% block content %}

<h1>Library</h1>

<!-- AUTHORS -->
<h2>Authors</h2>

<form action="{{ url_for('add_author') }}" method="POST">
    <input type="text" name="name" placeholder="Author Name" required>
    <input type="text" name="country" placeholder="Country" required>
    <button type="submit">Add Author</button>
</form>

<table>
    <tr>
        <th>Author ID</th>
        <th>Name</th>
        <th>Country</th>
        <th>Edit</th>
        <th>Delete</th>
    </tr>

    {% for author in authors %}
    <tr>
        <td>{{ author.author_id }}</td>

        <td>
            <input type="text"
                   name="name"
                   value="{{ author.name }}"
                   form="edit-author-{{ author.author_id }}"
                   required>
        </td>

        <td>
            <input type="text"
                   name="country"
                   value="{{ author.country }}"
                   form="edit-author-{{ author.author_id }}"
                   required>
        </td>

        <td>
            <form id="edit-author-{{ author.author_id }}"
                  action="{{ url_for('edit_author', author_id=author.author_id) }}"
                  method="POST">
                <button type="submit">Edit</button>
            </form>
        </td>

        <td>
            <form action="{{ url_for('delete_author', author_id=author.author_id) }}"
                  method="POST">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>


<!-- BOOKS -->
<h2>Books</h2>

<form action="{{ url_for('add_book') }}" method="POST">
    <input type="text" name="title" placeholder="Book Title" required>
    <input type="number" step="0.01" name="price" placeholder="Price" required>
    <input type="number" name="author_id" placeholder="Author ID" required>
    <button type="submit">Add Book</button>
</form>

<table>
    <tr>
        <th>Book ID</th>
        <th>Title</th>
        <th>Price</th>
        <th>Author ID</th>
        <th>Edit</th>
        <th>Delete</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.book_id }}</td>

        <td>
            <input type="text"
                   name="title"
                   value="{{ book.title }}"
                   form="edit-book-{{ book.book_id }}"
                   required>
        </td>

        <td>
            <input type="number"
                   step="0.01"
                   name="price"
                   value="{{ book.price }}"
                   form="edit-book-{{ book.book_id }}"
                   required>
        </td>

        <td>
            <input type="number"
                   name="author_id"
                   value="{{ book.author_id }}"
                   form="edit-book-{{ book.book_id }}"
                   required>
        </td>

        <td>
            <form id="edit-book-{{ book.book_id }}"
                  action="{{ url_for('edit_book', book_id=book.book_id) }}"
                  method="POST">
                <button type="submit">Edit</button>
            </form>
        </td>

        <td>
            <form action="{{ url_for('delete_book', book_id=book.book_id) }}"
                  method="POST">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
